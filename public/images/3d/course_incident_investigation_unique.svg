<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <path d="M0,100 L800,100 M0,200 L800,200 M0,300 L800,300 M0,400 L800,400 M0,500 L800,500" />
    <path d="M100,0 L100,600 M200,0 L200,600 M300,0 L300,600 M400,0 L400,600 M500,0 L500,600 M600,0 L600,600 M700,0 L700,600" />
  </g>

  <!-- Incident Caution Tape Strips (Top Right) -->
  <g transform="rotate(-12 600 -50)">
    <rect x="400" y="20" width="500" height="36" fill="url(#amberGrad)" rx="4" />
    <path d="M420,20 L440,56 M460,20 L480,56 M500,20 L520,56 M540,20 L560,56 M580,20 L600,56 M620,20 L640,56 M660,20 L680,56 M700,20 L720,56 M740,20 L760,56 M780,20 L800,56" stroke="#0F172A" stroke-width="12" />
    <text x="430" y="44" fill="#0F172A" font-family="system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="3">INCIDENT SCENE - DO NOT CROSS</text>
  </g>

  <!-- 3D Root Cause Analysis Tree / Node Network -->
  <g filter="url(#glow)">
    <!-- Connections -->
    <line x1="180" y1="260" x2="300" y2="200" stroke="#38BDF8" stroke-width="4" stroke-dasharray="6,6" />
    <line x1="180" y1="260" x2="300" y2="320" stroke="#38BDF8" stroke-width="4" stroke-dasharray="6,6" />
    <line x1="300" y1="200" x2="420" y2="160" stroke="#F59E0B" stroke-width="3" />
    <line x1="300" y1="200" x2="420" y2="240" stroke="#F59E0B" stroke-width="3" />
    <line x1="300" y1="320" x2="420" y2="320" stroke="#F59E0B" stroke-width="3" />

    <!-- Nodes -->
    <circle cx="180" cy="260" r="28" fill="#0284C7" stroke="#38BDF8" stroke-width="4" />
    <text x="180" y="266" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">EVENT</text>

    <circle cx="300" cy="200" r="22" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <text x="300" y="205" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="11">WHY 1</text>

    <circle cx="300" cy="320" r="22" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <text x="300" y="325" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-weight="bold" font-size="11">WHY 2</text>

    <circle cx="420" cy="160" r="18" fill="#D97706" stroke="#F59E0B" stroke-width="3" />
    <text x="420" y="164" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="9">ROOT</text>

    <circle cx="420" cy="240" r="18" fill="#D97706" stroke="#F59E0B" stroke-width="3" />
    <text x="420" y="244" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="9">CAUSE</text>
  </g>

  <!-- 3D Forensic Inspection Document -->
  <g filter="url(#dropShadow)" transform="translate(480, 240)">
    <rect x="0" y="0" width="240" height="300" rx="16" fill="#1E293B" stroke="#334155" stroke-width="3" />
    <!-- Header banner -->
    <rect x="0" y="0" width="240" height="60" rx="16" fill="#0284C7" />
    <text x="120" y="36" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="1">INCIDENT REPORT</text>
    
    <!-- Report lines -->
    <rect x="24" y="84" width="120" height="10" rx="5" fill="#38BDF8" />
    <rect x="24" y="108" width="192" height="8" rx="4" fill="#475569" />
    <rect x="24" y="128" width="160" height="8" rx="4" fill="#475569" />
    <rect x="24" y="148" width="180" height="8" rx="4" fill="#475569" />

    <!-- Approved Badge -->
    <circle cx="180" cy="220" r="32" fill="#F59E0B" />
    <circle cx="180" cy="220" r="26" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,2" />
    <text x="180" y="225" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="11">VERIFIED</text>
  </g>

  <!-- Black African Inspector Avatar Circle (3D Style) -->
  <g filter="url(#dropShadow)" transform="translate(180, 420)">
    <!-- outer glowing ring -->
    <circle cx="0" cy="0" r="70" fill="#1E293B" stroke="#38BDF8" stroke-width="5" />
    <clipPath id="avatarClip">
      <circle cx="0" cy="0" r="66" />
    </clipPath>
    <g clip-path="url(#avatarClip)">
      <rect x="-70" y="-70" width="140" height="140" fill="#0F172A" />
      <!-- Skin tone -->
      <path d="M-25,20 C-20,-10 20,-10 25,20 C25,45 -25,45 -25,20" fill="#583119" />
      <circle cx="0" cy="-10" r="32" fill="#583119" />
      <!-- Safety Helmet -->
      <path d="M-36,-14 C-36,-44 36,-44 36,-14 Z" fill="#F59E0B" />
      <rect x="-42" y="-16" width="84" height="8" rx="4" fill="#D97706" />
      <!-- Vest -->
      <path d="M-45,60 L-30,15 L30,15 L45,60 Z" fill="#0284C7" />
      <path d="M-20,15 L-10,60 M20,15 L10,60" stroke="#F59E0B" stroke-width="6" />
    </g>
    <!-- Label -->
    <rect x="-60" y="48" width="120" height="26" rx="13" fill="#38BDF8" />
    <text x="0" y="65" text-anchor="middle" fill="#0F172A" font-family="sans-serif" font-weight="800" font-size="11" letter-spacing="1">HSE INVESTIGATOR</text>
  </g>

  <!-- 3D Magnifying Glass Over Specimen -->
  <g filter="url(#dropShadow)" transform="translate(360, 360)">
    <!-- Lens Frame -->
    <circle cx="0" cy="0" r="64" fill="url(#glassGrad)" stroke="#38BDF8" stroke-width="8" />
    <!-- Reflection highlight -->
    <path d="M-40,-30 A 50 50 0 0 1 20,-50" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7" />
    <!-- Handle -->
    <rect x="44" y="44" width="24" height="90" rx="12" fill="#334155" transform="rotate(-45 44 44)" stroke="#0284C7" stroke-width="3" />
    <!-- Inner Crosshair -->
    <circle cx="0" cy="0" r="6" fill="#F59E0B" />
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" />
  </g>

  <!-- Bottom Title Banner -->
  <g transform="translate(400, 565)">
    <text x="0" y="0" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="2">ROOT CAUSE ANALYSIS &amp; INCIDENT INVESTIGATION</text>
  </g>
</svg>
